<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>6FOLIO Hero Mockup</title>
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --blue: #1636f8;
        --paper: #f4f1ea;
        --ink: #0a0a0f;
        --line: rgba(10, 10, 15, 0.14);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
        background: var(--paper);
        color: var(--ink);
        font-family: "Plus Jakarta Sans", "Helvetica Neue", Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
      }

      a {
        color: inherit;
        text-decoration: none;
      }

      .mockup {
        display: grid;
        grid-template-columns: 70fr 30fr;
        min-height: 100svh;
        background: var(--paper);
      }

      .stage {
        position: relative;
        min-height: 100svh;
        overflow: hidden;
        background: var(--blue);
      }

      #dither {
        position: absolute;
        inset: 0;
        display: block;
        width: 100%;
        height: 100%;
      }

      .stage-top {
        position: absolute;
        z-index: 2;
        top: 28px;
        left: 32px;
        right: 32px;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }

      .brand {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        padding: 8px 10px;
        border-radius: 3px;
        background: var(--blue);
        color: var(--paper);
      }

      .brand-mark {
        display: inline-grid;
        grid-template-columns: 1fr 1fr;
        width: 38px;
        height: 20px;
        overflow: hidden;
        border-radius: 2px;
        background: var(--paper);
        color: var(--blue);
        font-size: 8px;
        font-weight: 800;
        line-height: 1;
      }

      .brand-mark span {
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .brand-mark span:last-child {
        background: rgba(244, 241, 234, 0.72);
      }

      .brand-name {
        font-size: 20px;
        font-weight: 700;
        line-height: 1;
        letter-spacing: -0.055em;
      }

      .hero-copy {
        position: absolute;
        z-index: 2;
        bottom: 32px;
        left: 32px;
        width: min(660px, 68%);
        padding: 26px 34px 32px;
        border-top: 1px solid var(--line);
        background: var(--paper);
      }

      .hero-copy h1 {
        margin: 0;
        font-size: clamp(2.8rem, 4.4vw, 4rem);
        font-weight: 500;
        line-height: 0.9;
        letter-spacing: -0.065em;
      }

      .hero-copy h1 span {
        color: var(--blue);
      }

      .hero-copy p {
        max-width: 36ch;
        margin: 22px 0 0;
        color: rgba(10, 10, 15, 0.68);
        font-size: 0.95rem;
        line-height: 1.6;
      }

      .rail {
        position: relative;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        min-height: 100svh;
        padding: 28px 26px 26px;
        border-left: 1px solid var(--line);
        background: var(--paper);
      }

      .vertical-nav {
        --pos: 0;
        position: relative;
        display: grid;
        grid-template-rows: repeat(5, 64px);
        border-top: 1px solid var(--line);
        border-bottom: 1px solid var(--line);
        isolation: isolate;
      }

      .vertical-nav::before {
        content: "";
        position: absolute;
        z-index: 0;
        top: 0;
        left: 0;
        right: 0;
        height: 64px;
        border-radius: 999px;
        background: var(--blue);
        opacity: 0;
        transform: translateY(calc(var(--pos) * 64px));
        transition:
          transform 450ms cubic-bezier(0.34, 1.3, 0.64, 1),
          opacity 200ms ease;
      }

      .vertical-nav[data-current]::before,
      .vertical-nav:has(a:is(:hover, :focus-visible))::before {
        opacity: 1;
      }

      .vertical-nav[data-current="0"] {
        --pos: 0;
      }

      .vertical-nav:has(> a:nth-child(1):is(:hover, :focus-visible)) {
        --pos: 0;
      }

      .vertical-nav:has(> a:nth-child(2):is(:hover, :focus-visible)) {
        --pos: 1;
      }

      .vertical-nav:has(> a:nth-child(3):is(:hover, :focus-visible)) {
        --pos: 2;
      }

      .vertical-nav:has(> a:nth-child(4):is(:hover, :focus-visible)) {
        --pos: 3;
      }

      .vertical-nav:has(> a:nth-child(5):is(:hover, :focus-visible)) {
        --pos: 4;
      }

      .vertical-nav a {
        position: relative;
        z-index: 1;
        display: flex;
        align-items: center;
        padding: 0 20px;
        border-bottom: 1px solid var(--line);
        color: var(--ink);
        font-size: 1.2rem;
        font-weight: 500;
        letter-spacing: -0.04em;
        transition: color 300ms ease;
      }

      .vertical-nav a:last-child {
        border-bottom: 0;
      }

      .vertical-nav a[aria-current="page"],
      .vertical-nav a:is(:hover, :focus-visible) {
        color: var(--paper);
      }

      .vertical-nav a[aria-current="page"]:not(:hover, :focus-visible) {
        border-bottom-color: transparent;
      }

      .vertical-nav:has(a:is(:hover, :focus-visible))
        a[aria-current="page"]:not(:hover, :focus-visible) {
        color: var(--ink);
      }

      .vertical-nav a:focus-visible {
        outline: 2px solid var(--ink);
        outline-offset: 2px;
      }

      .big-cta {
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        min-height: 190px;
        padding: 22px 22px 20px;
        background: var(--blue);
        color: var(--paper);
        transition: background-color 250ms ease;
      }

      .big-cta:hover {
        background: var(--ink);
      }

      .big-cta:focus-visible {
        outline: 2px solid var(--ink);
        outline-offset: 3px;
      }

      .big-cta-label {
        font-size: clamp(1.4rem, 1.9vw, 1.8rem);
        font-weight: 500;
        line-height: 1.05;
        letter-spacing: -0.045em;
      }

      .big-cta-arrow {
        align-self: flex-end;
        font-size: 2.2rem;
        font-weight: 400;
        line-height: 1;
      }

      @media (max-width: 900px) {
        .mockup {
          grid-template-columns: 1fr;
        }

        .stage {
          min-height: 72svh;
        }

        .stage-top {
          top: 18px;
          left: 18px;
          right: 18px;
        }

        .hero-copy {
          bottom: 16px;
          left: 16px;
          width: calc(100% - 32px);
          padding: 22px 24px 24px;
        }

        .hero-copy h1 {
          font-size: clamp(2.4rem, 8.5vw, 3.6rem);
        }

        .rail {
          gap: 40px;
          min-height: auto;
          padding: 22px 16px 16px;
          border-top: 1px solid var(--line);
          border-left: 0;
        }

        .vertical-nav {
          grid-template-rows: repeat(5, 56px);
        }

        .vertical-nav::before {
          height: 56px;
          transform: translateY(calc(var(--pos) * 56px));
        }

        .big-cta {
          min-height: 160px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .vertical-nav::before,
        .vertical-nav a,
        .big-cta {
          transition: none;
        }
      }
    </style>
  </head>

  <body>
    <main class="mockup">
      <section class="stage" aria-label="Hero stage">
        <canvas id="dither" aria-hidden="true"></canvas>

        <div class="stage-top">
          <a class="brand" href="/" aria-label="6folio home">
            <span class="brand-mark" aria-hidden="true">
              <span>6</span>
              <span>F</span>
            </span>
            <span class="brand-name">6folio</span>
          </a>
        </div>

        <div class="hero-copy">
          <h1>
            six perspectives.<br />
            <span>one clear direction.</span>
          </h1>
          <p>
            An independent creative growth studio connecting brand, content,
            production, marketing, and digital experience.
          </p>
        </div>
      </section>

      <aside class="rail" aria-label="Navigation and contact">
        <nav class="vertical-nav" data-current="0" aria-label="Primary">
          <a href="/work" aria-current="page">Work</a>
          <a href="/services">Services</a>
          <a href="/approach">Approach</a>
          <a href="/about">About</a>
          <a href="/contact">Contact</a>
        </nav>

        <a class="big-cta" href="/contact">
          <span class="big-cta-label">Start a project</span>
          <span class="big-cta-arrow" aria-hidden="true">↗</span>
        </a>
      </aside>
    </main>

    <script>
      const canvas = document.getElementById("dither");
      const stage = canvas.parentElement;
      const context = canvas.getContext("2d");
      const cell = 14;
      const bayer = [
        [0, 8, 2, 10],
        [12, 4, 14, 6],
        [3, 11, 1, 9],
        [15, 7, 13, 5],
      ];
      const reducedMotion = window.matchMedia(
        "(prefers-reduced-motion: reduce)",
      ).matches;

      let width = 0;
      let height = 0;
      let time = 0;
      let last = 0;
      let frame = 0;

      function getChar(x, y) {
        const hash = Math.sin(x * 12.9898 + y * 78.233) * 43758.5453;
        return hash - Math.floor(hash) > 0.5 ? "6" : "F";
      }

      function draw() {
        if (!context || width === 0 || height === 0) return;

        context.fillStyle = "#1636f8";
        context.fillRect(0, 0, width, height);
        context.font = 'bold 11px "Courier New", monospace';
        context.textAlign = "center";
        context.textBaseline = "middle";

        for (let y = 0; y < height; y += cell) {
          const ny = y * 0.012;

          for (let x = 0; x < width; x += cell) {
            const nx = x * 0.012;
            const noise =
              Math.sin(nx * 1.15 + time) * 0.34 +
              Math.cos(ny * 1.4 - time * 0.8) * 0.32 +
              Math.sin((nx + ny) * 0.9 + time * 0.45) * 0.24;
            const dither =
              bayer[Math.floor(y / cell) % 4][Math.floor(x / cell) % 4] / 16 -
              0.5;
            const isBlue = noise + dither * 0.6 > 0;

            context.fillStyle = isBlue ? "#1636f8" : "#f4f1ea";
            context.fillRect(x, y, cell, cell);

            context.fillStyle = isBlue ? "#f4f1ea" : "#1636f8";
            context.fillText(getChar(x, y), x + cell / 2, y + cell / 2);
          }
        }
      }

      function resize() {
        const rect = stage.getBoundingClientRect();
        const dpr = Math.min(window.devicePixelRatio || 1, 2);

        width = rect.width;
        height = rect.height;
        canvas.width = Math.max(1, Math.round(width * dpr));
        canvas.height = Math.max(1, Math.round(height * dpr));
        canvas.style.width = `${width}px`;
        canvas.style.height = `${height}px`;
        context.setTransform(dpr, 0, 0, dpr, 0, 0);
        draw();
      }

      function loop(timestamp) {
        if (!reducedMotion && timestamp - last > 32) {
          time += 0.008;
          draw();
          last = timestamp;
        }

        if (!reducedMotion) {
          frame = requestAnimationFrame(loop);
        }
      }

      resize();
      window.addEventListener("resize", resize);

      if (!reducedMotion) {
        frame = requestAnimationFrame(loop);
      }

      window.addEventListener("pagehide", () => {
        cancelAnimationFrame(frame);
      });
    </script>
  </body>
</html>
